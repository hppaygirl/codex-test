<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비공개 작업물</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #lock, #secret, #locked { display: none; }
  </style>
</head>
<body>

<div id="lock">
  <h2>🔐 비공개 프로젝트</h2>
  <input type="password" id="pw" placeholder="비밀번호 입력">
  <button onclick="check()">확인</button>
  <p id="msg" style="color:red;"></p>
</div>

<div id="secret">
  <h1>✨ 프로젝트 내용</h1>
  <p>이건 대외비 프로젝트 설명이야!</p>
</div>

<div id="locked">
  <h2>🚫 접근이 차단되었습니다.</h2>
  <p>비밀번호를 3회 이상 틀렸습니다.</p>
</div>

<script>
  const correctPw = "design123";
  let attempts = 0;

  document.getElementById("lock").style.display = "block";

  function check() {
    const input = document.getElementById("pw").value;
    attempts++;

    if (input === correctPw) {
      document.getElementById("lock").style.display = "none";
      document.getElementById("secret").style.display = "block";
    } else if (attempts >= 3) {
      document.getElementById("lock").style.display = "none";
      document.getElementById("locked").style.display = "block";
    } else {
        document.getElementById("msg").textContent = `비밀번호가 틀렸습니다. (${attempts}/3)`;  }
</script>

</body>
</html>
